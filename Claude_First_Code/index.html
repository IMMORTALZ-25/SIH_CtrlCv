<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Complaint — Campus Desk</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark"></span>Campus Desk</div>
  <nav>
    <a href="index.html" class="active">Submit</a>
    <a href="track.html">Track</a>
    <a href="admin.html">Admin</a>
  </nav>
</div>

<div class="page">
  <div class="page-head">
    <h1>Submit a complaint</h1>
    <p>Tell us what's wrong — hostel, mess, wifi, or anything else on campus. We'll route it and keep you updated.</p>
  </div>

  <div class="panel">
    <div id="msgBox"></div>
    <form id="complaintForm">
      <div class="row2">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Wifi down in Block C" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="" disabled selected>Choose one</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="What happened? Any details that help us fix it faster."></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label for="location">Location / block</label>
          <input type="text" id="location" placeholder="e.g. Hostel Block A, Room 214">
        </div>
        <div class="field">
          <label for="student_name">Your name</label>
          <input type="text" id="student_name" placeholder="So we can find your complaint later">
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Submit complaint</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  const catSelect = document.getElementById('category');
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });

  const form = document.getElementById('complaintForm');
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    msgBox.innerHTML = '';

    const payload = {
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value,
      description: document.getElementById('description').value.trim() || null,
      location: document.getElementById('location').value.trim() || null,
      student_name: document.getElementById('student_name').value.trim() || null,
    };

    const { data, error } = await supabaseClient.from('complaints').insert([payload]).select();

    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit complaint';

    if (error) {
      msgBox.innerHTML = `<div class="msg msg-error">Couldn't submit: ${error.message}</div>`;
      return;
    }

    const id = data[0].id;
    msgBox.innerHTML = `<div class="msg msg-success">Submitted. Your complaint ID is <strong>${id}</strong> — save it to track status on the Track page.</div>`;
    form.reset();
  });
</script>

</body>
</html>
